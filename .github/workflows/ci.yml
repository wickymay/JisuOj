name: Verify source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jisuoj-next/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jisuoj-next/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jisuoj-next/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: jisuoj-next/backend/pom.xml
      - run: mvn -B verify
  teaching-resources:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jisuoj-next
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_teaching_skill.py
      - run: |
          mkdir -p output/teaching-skills
          g++ -std=c++17 -O2 -Wall -Wextra -Ibackend/src/main/resources/teaching-skills/competitive-programming-tutor/examples backend/src/test/cpp/teaching_algorithms_test.cpp -o output/teaching-skills/algorithms-test
          output/teaching-skills/algorithms-test
  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jisuoj-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.4
      - run: python -m unittest discover -s rag -p 'test_*.py' -v
