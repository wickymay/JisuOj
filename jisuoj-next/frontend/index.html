<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1424" />
    <meta name="description" content="JISUOJ 在线评测平台" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('jisuoj-theme')
          const theme = saved === 'light' || saved === 'dark' || saved === 'classic'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
          const browserColor = theme === 'light' ? '#e9e5df' : theme === 'classic' ? '#08111f' : '#151515'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', browserColor)
        } catch { /* Use the default dark theme when storage is unavailable. */ }
      })()
    </script>
    <title>JISUOJ</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
